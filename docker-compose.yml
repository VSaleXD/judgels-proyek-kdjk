version: '3.8'

networks:
  judgels-net:
    driver: bridge

volumes:
  mysql_data:
  server_data:
  grader_data:

services:
  db:
    image: mysql:8.0
    container_name: judgels-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - judgels-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: judgels-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - judgels-net

  judgels-server:
    image: ghcr.io/ia-toki/judgels/server:${JUDGELS_VERSION:-3.0.0}
    container_name: judgels-server
    restart: unless-stopped
    depends_on:
      - db
      - rabbitmq
    ports:
      - "${SERVER_PORT:-9101}:9101"
    volumes:
      - server_data:/judgels/server/var/data
      - ./conf/judgels-server.yml:/judgels/server/var/conf/judgels-server.yml:ro
    networks:
      - judgels-net

  judgels-client:
    image: ghcr.io/ia-toki/judgels/client:${JUDGELS_VERSION:-3.0.0}
    container_name: judgels-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5000}:5000"
    volumes:
      - ./conf/judgels-client.js:/judgels/client/var/conf/judgels-client.js:ro
    networks:
      - judgels-net

  judgels-grader:
    image: ghcr.io/ia-toki/judgels/grader:${JUDGELS_VERSION:-3.0.0}
    container_name: judgels-grader
    restart: unless-stopped
    privileged: true
    depends_on:
      - rabbitmq
      - judgels-server
    volumes:
      - grader_data:/judgels/grader/var/data
      - server_data:/judgels/server/var/data:ro
      - ./conf/judgels-grader.yml:/judgels/grader/var/conf/judgels-grader.yml:ro
    networks:
      - judgels-net
